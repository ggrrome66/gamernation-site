# headers.conf — security response headers (plan §7.1).
#
# IMPORTANT: nginx add_header directives are NOT inherited into any location
# block that declares its own add_header. Include this file in EVERY location
# (and server) block that sets headers:   include /etc/nginx/snippets/gn-headers.conf;
#
# CSP notes:
#  - no 'unsafe-inline', no 'unsafe-eval' — the site has zero inline CSS/JS (C4)
#  - connect-src 'none' — the site makes zero network calls after load; keep it that way

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
