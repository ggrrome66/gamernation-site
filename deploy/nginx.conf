# nginx.conf — GamerNation Inc. site (plan §6.2, §7.2, §7.3).
#
# Install as /etc/nginx/conf.d/gamernation.conf (included in the http{} context,
# so the map/limit_req_zone directives below are valid here).
# Also copy deploy/headers.conf → /etc/nginx/snippets/gn-headers.conf.
#
# Certbot manages the ssl_certificate lines; run:
#   sudo certbot --nginx -d gamernation.ca -d www.gamernation.ca
# Web root: /srv/gamernation  (rsync target from build machine, see README)
#
# Requires: nginx with ngx_brotli for brotli_static (Debian/RPi OS:
# libnginx-mod-http-brotli-static). If unavailable, comment brotli_static out;
# gzip_static still serves the .gz files. Never compress at request time on a Pi.

# ── CLI content negotiation (plan §6.2) ─────────────────────────────────
# curl/wget/etc. get pre-rendered ANSI text. Static files, no execution.
map $http_user_agent $is_cli {
    default                                                   0;
    "~*curl|wget|httpie|powershell|python-requests|lynx-cli"  1;
}

# ?plain (any position in the query string) selects the ANSI-stripped variant.
# Windows note: curl.exe sends the same UA as unix curl, so bare-curl-on-Windows
# can't be detected server-side — cmd.exe users append ?plain instead.
map $args $txt_variant {
    default                    "";
    "~(^|&)plain(=|&|$)"       ".plain";
}

# ── rate / connection limits (plan §7.3) ────────────────────────────────
limit_req_zone  $binary_remote_addr zone=gn:10m     rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gnconn:10m;

# ── catch-alls: unknown Host gets nothing (plan §7.3) ───────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── HTTP → HTTPS only ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gamernation.ca www.gamernation.ca;
    return 301 https://$host$request_uri;
}

# ── the site ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gamernation.ca www.gamernation.ca;

    root /srv/gamernation;

    # TLS (plan §7.2) — Mozilla Intermediate
    # ssl_certificate     /etc/letsencrypt/live/gamernation.ca/fullchain.pem;   # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/gamernation.ca/privkey.pem;     # managed by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # hardening (plan §7.3)
    server_tokens off;
    autoindex off;
    client_max_body_size 1k;          # nothing is ever uploaded
    client_body_timeout 5s;
    client_header_timeout 5s;
    limit_req zone=gn burst=40 nodelay;
    limit_conn gnconn 20;

    # log privacy (plan §7.4): a brochure site has nothing to analyze,
    # and the SD card thanks you. Flip to a tmpfs path + anonymized format if needed.
    access_log off;

    # serve precompressed files only — never compress at request time on a Pi
    gzip_static on;
    brotli_static on;

    include /etc/nginx/snippets/gn-headers.conf;

    # deny dotfiles except /.well-known/
    location ~ /\.(?!well-known/) { deny all; }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/gn-headers.conf;
        default_type "text/plain; charset=utf-8";
    }

    # front door: browsers get HTML, command-line tools get ANSI text
    location = / {
        include /etc/nginx/snippets/gn-headers.conf;
        if ($is_cli) { rewrite ^ /txt/index$txt_variant.txt last; }
        try_files /index.html =404;
    }

    # /architecture — the MOD.04 configurator; CLI tools get its ANSI page
    location ~ ^/(architecture|arch)$ {
        include /etc/nginx/snippets/gn-headers.conf;
        if ($is_cli) { rewrite ^ /txt/arch$txt_variant.txt last; }
        try_files /architecture.html =404;
    }

    # /term opens the site with the terminal up (client-side route)
    location = /term {
        include /etc/nginx/snippets/gn-headers.conf;
        try_files /index.html =404;
    }

    # pre-rendered ANSI pages: curl gamernation.ca/txt/air.txt
    location /txt/ {
        include /etc/nginx/snippets/gn-headers.conf;
        default_type "text/plain; charset=utf-8";
        add_header Content-Disposition "inline";
        if ($txt_variant) { rewrite ^/txt/([a-z]+)\.txt$ /txt/$1.plain.txt break; }
        try_files $uri =404;
    }

    # static assets, long cache (filenames are stable; cache is cheap insurance)
    location ~* \.(css|js|svg)$ {
        include /etc/nginx/snippets/gn-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/gn-headers.conf;
        try_files $uri =404;
    }
}
